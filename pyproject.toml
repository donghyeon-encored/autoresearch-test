[project]
name = "tiny-bert-autoresearch"
version = "0.1.0"
description = "Time-budgeted BERT MLM experiments on CPU, MPS, or CUDA"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.6,<3",
  "tokenizers>=0.21,<1",
  "huggingface-hub>=0.30,<2",
  "httpx>=0.28,<1",
  "pyarrow>=19,<24",
  "numpy>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.uv]
package = false
cache-dir = ".uv-cache"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
